    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇺🇲 美国
      - 🇸🇬 新加坡
      - 🇨🇳 台湾
      - 🇰🇷 韩国
      - 🇭 Hysteria2
      - 🇷 Reality
      - 🌐 其他地区
