    filter: "(B|D)"

  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇭 Hysteria2
      - 🇷 Reality
      - 🌐 其他地区
      - 🚀 手动切换

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇺🇲 美国
      - 🇸🇬 新加坡
      - 🇨🇳 台湾
      - 🇰🇷 韩国
      - 🇭 Hysteria2
      - 🇷 Reality
      - 🌐 其他地区

  - name: "⚡ 专线"
    type: select
    use:
      - Paoluz
    filter: "(IEPL|IPLC|BGP|专线|B|D1R)"

  - name: "🇭🇰 香港"
    type: select
    use:
      - Paoluz
    filter: "(?i)(港|HK|Hong Kong|🇭🇰|HongKong)"

  - name: "🇯🇵 日本"
    type: select
    use:
      - Paoluz
    filter: "(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan)"

  - name: "🇺🇲 美国"
    type: select
    use:
      - Paoluz
    filter: "(?i)(美|US|United States|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥)"

  - name: "🇸🇬 新加坡"
    type: select
    use:
      - Paoluz
    filter: "(?i)(新加坡|坡|狮城|SG|Singapore)"

  - name: "🇨🇳 台湾"
    type: select
    use:
      - Paoluz
    filter: "(?i)(台|新北|彰化|TW|Taiwan)"

  - name: "🇰🇷 韩国"
    type: select
    use:
      - Paoluz
    filter: "(?i)(KR|Korea|KOR|首尔|韩|韓)"

  - name: "🇭 Hysteria2"
    type: select
    use:
      - Paoluz
    filter: "(?i)Y"

  - name: "🇷 Reality"
    type: select
    use:
      - Paoluz
    filter: "(?i)V"

  - name: "🌐 其他地区"
    type: select
    use:
      - Paoluz
    exclude-filter: "(?i)(港|HK|🇭🇰|日本|JP|美|US|新加坡|坡|SG|台|新北|彰化|TW|KR|Korea|KOR|首尔|韩|韓|Y|V|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥)"

