allow-lan: false
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090
unified-delay: true
keep-alive-interval: 360
global-client-fingerprint: chrome
clash-for-android:
  append-system-dns: false
cfw-bypass:
  - localhost
  - 127.*
  - 10.*
  - 172.16.*
  - 192.168.*
  - <local>
hosts:
  mtalk.google.com: 108.177.125.188
  paoluz.link: 104.21.71.42
dns:
  enable: true
  listen: 127.0.0.1:5335
  default-nameserver: [180.184.1.1, 119.29.29.29, 223.5.5.5]
  proxy-server-nameserver: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-filter: ["*.market.xiaomi.com","*.n.n.srv.nintendo.net", +.stun.playstation.net, xbox.*.*.microsoft.com, "*.msftncsi.com", "*.msftconnecttest.com", WORKGROUP, "*.lan", stun.*.*.*, stun.*.*, time.windows.com, time.nist.gov, time.apple.com, time.asia.apple.com, "*.ntp.org.cn", "*.openwrt.pool.ntp.org", time1.cloud.tencent.com, time.ustc.edu.cn, pool.ntp.org, ntp.ubuntu.com, "*.*.xboxlive.com", speedtest.cros.wr.pvp.net, stun.services.mozilla1.com, ntp.nasa.gov]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query, https://223.5.5.5/dns-query]
  nameserver-policy:
    "geosite:bytedance":
        - 180.184.1.1
        - 180.184.2.2
    "geosite:cn,apple,category-games@cn,private":
        - 119.29.29.29
        - 223.6.6.6

proxy-providers:
  Paoluz:
    type: http
    url: "https://appv2.nloli.xyz/tako_api/sub?token=SL1x1lGS2ZVLW378&base=list&addFlag=yes"
    interval: 86400
    path: "./providers/Paoluz.yaml"
    health-check:
      enable: true
      interval: 300
      url: https://www.gstatic.com/generate_204

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - DIRECT
      - ⚡ 专线
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇺🇲 美国
      - 🇸🇬 新加坡
      - 🇨🇳 台湾
      - 🇰🇷 韩国
      - 🇭 Hysteria2
      - 🇷 Reality
      - 🌐 其他地区
      - 🚀 手动切换

  - name: "🚀 手动切换"
    type: select
    use:
      - Paoluz

  - name: "🇯🇵 JP"
    type: select
    proxies:
      - 🇯🇵 日本
      - ⚡ 专线
      - 🇭 Hysteria2
      - 🇷 Reality
    use:
      - Paoluz
    filter: "(?i)(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan)"

  - name: "🖼️ EH"
    type: select
    proxies:
      - DIRECT
    use:
      - Paoluz

  - name: "🚫 广告屏蔽"
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 🚀 节点选择
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇺🇲 美国
      - 🇸🇬 新加坡
      - 🇨🇳 台湾
      - 🇰🇷 韩国
